name: Bug report
description: Report something that is not working correctly.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a bug. Please include enough detail to reproduce the issue.

  - type: input
    id: version
    attributes:
      label: Turnlight version
      description: Example: v0.9.1-beta
      placeholder: v0.9.1-beta
    validations:
      required: true

  - type: input
    id: windows-version
    attributes:
      label: Windows version
      description: Example: Windows 11 23H2, Windows 11 24H2, Windows 10
      placeholder: Windows 11
    validations:
      required: true

  - type: input
    id: monitor-setup
    attributes:
      label: Monitor setup
      description: Include number of monitors and anything unusual like vertical monitors, scaling, or negative offsets.
      placeholder: 2 monitors, primary on the left, 125% scaling
    validations:
      required: true

  - type: input
    id: ai-tool
    attributes:
      label: AI tool or app being watched
      description: Example: Codex, ChatGPT, Cursor, Windsurf, Claude, other
      placeholder: Codex
    validations:
      required: true

  - type: textarea
    id: region-samples
    attributes:
      label: Region and samples
      description: Describe the selected region and how many Busy, Ready, and Ignored samples you captured.
      placeholder: "Region is the send/stop button. Busy: 5, Ready: 5, Ignored: 2."
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      description: List the exact steps that trigger the problem.
      placeholder: |
        1. Open Turnlight
        2. Set region
        3. Capture samples
        4. Start watching
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      placeholder: Turnlight should show the alert after the agent goes from busy to ready.
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
      placeholder: Turnlight did not alert, alerted too early, or showed an error.
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: Extra details
      description: Add screenshots, logs, or notes if useful. Avoid sharing private screen content.
